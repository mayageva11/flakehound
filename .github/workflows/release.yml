name: release

# Publish to npm on a version tag (v0.2.0, v1.0.0, …).
# One-time setup: create an npm automation token and add it as the NPM_TOKEN
# repository secret. Then: npm version <x.y.z> && git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # GitHub Release for the tag — this is what versions the Marketplace listing.
  # (First-time Marketplace publication is a one-off manual step in the web UI;
  # after that, each release created here updates the listing automatically.)
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
