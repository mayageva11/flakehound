name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The reusable action, exercised against the repo's own fixtures: the e2e
  # history contains one regression, so the gate must report exit code 1 and
  # produce a well-formed report artifact.
  action-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: flakehound
        uses: ./
        with:
          input-glob: 'tests/fixtures/e2e/*/junit.xml'
          no-ai: 'true'
          fail-on-new-regressions: 'false'
      - name: Assert gate verdict and report shape
        run: |
          test "${{ steps.flakehound.outputs.exit-code }}" = "1" || { echo "expected exit-code 1, got '${{ steps.flakehound.outputs.exit-code }}'"; exit 1; }
          node -e "
            const r = require('./${{ steps.flakehound.outputs.report-path }}');
            if (r.version !== 1) throw new Error('bad report version');
            if (r.gate.newRegressions.length !== 1) throw new Error('expected 1 new regression');
            if (r.clusters.length !== 2) throw new Error('expected 2 clusters');
            console.log('action self-test OK:', JSON.stringify(r.gate));
          "
