name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The reusable action, exercised against the repo's own fixtures: the e2e
  # history contains one regression, so the gate must report exit code 1 and
  # produce a well-formed report artifact.
  action-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: flakehound
        uses: ./
        with:
          input-glob: 'tests/fixtures/e2e/*/junit.xml'
          no-ai: 'true'
          fail-on-new-regressions: 'false'
          quarantine: 'true'
      - name: Assert gate verdict and report shape
        run: |
          test "${{ steps.flakehound.outputs.exit-code }}" = "1" || { echo "expected exit-code 1, got '${{ steps.flakehound.outputs.exit-code }}'"; exit 1; }
          # The dry-run must set the output either way — and must not have touched the tree.
          case "${{ steps.flakehound.outputs.quarantine-pending }}" in
            true|false) ;;
            *) echo "quarantine-pending not set"; exit 1 ;;
          esac
          git diff --exit-code -- tests/ || { echo "quarantine dry-run modified the repo!"; exit 1; }
          node -e "
            const r = require('./${{ steps.flakehound.outputs.report-path }}');
            if (r.version !== 1) throw new Error('bad report version');
            if (r.gate.newRegressions.length !== 1) throw new Error('expected 1 new regression');
            if (r.clusters.length !== 2) throw new Error('expected 2 clusters');
            console.log('action self-test OK:', JSON.stringify(r.gate));
          "

  # cache-baseline with a per-run-unique prefix: nothing was ever saved under it,
  # so the restore deterministically misses and the run must be identical to the
  # fail-safe path (baselineUsed=false, every regression new). Proves the cache
  # wiring never changes the verdict on a miss. (A static prefix would restore a
  # prior run's baseline via restore-keys — that's the feature working, but not
  # what this job asserts.)
  action-cache-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: flakehound
        uses: ./
        with:
          input-glob: 'tests/fixtures/e2e/*/junit.xml'
          no-ai: 'true'
          fail-on-new-regressions: 'false'
          cache-baseline: 'true'
          cache-key-prefix: flakehound-selftest-${{ github.run_id }}
      - name: Assert fail-safe verdict on a cache miss
        run: |
          test "${{ steps.flakehound.outputs.exit-code }}" = "1" || { echo "expected exit-code 1, got '${{ steps.flakehound.outputs.exit-code }}'"; exit 1; }
          node -e "
            const r = require('./${{ steps.flakehound.outputs.report-path }}');
            if (r.gate.baselineUsed !== false) throw new Error('cache miss must fail safe (baselineUsed=false)');
            if (r.gate.newRegressions.length !== 1) throw new Error('expected 1 new regression');
            console.log('cache self-test OK:', JSON.stringify(r.gate));
          "
