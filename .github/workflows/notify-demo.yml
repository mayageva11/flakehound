name: notify-demo

# The demo repo (mayageva11/flakehound-demo) serves a copy of docs/index.html
# with its config injected. This workflow tells it the dashboard changed, so
# its sync-dashboard.yml can refresh the live demo immediately instead of
# waiting for the next 6-hourly pipeline run.
#
# Cross-repo dispatch needs a token with Contents read/write on the demo repo:
# a fine-grained PAT stored here as the DEMO_DISPATCH_TOKEN secret. Without
# the secret this workflow just logs and exits green — safe to keep enabled.
on:
  push:
    branches: [main]
    paths: [docs/index.html]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to the demo repo
        env:
          TOKEN: ${{ secrets.DEMO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DEMO_DISPATCH_TOKEN not set — skipping (the demo will sync on its next scheduled run)"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/mayageva11/flakehound-demo/dispatches \
            -d '{"event_type":"dashboard-updated"}'
          echo "dispatched dashboard-updated to mayageva11/flakehound-demo"
