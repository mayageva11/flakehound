name: flakehound
# Marketplace requires < 125 characters.
description: >-
  Root-cause analysis for flaky tests: clusters failures, gates CI on new
  regressions, quarantines flaky tests automatically.
branding:
  icon: activity
  color: purple

inputs:
  input-glob:
    description: Glob of JUnit XML files (the run history)
    required: true
  baseline:
    description: Path to the previous flakehound.report.json (regressions in it are known)
    required: false
    default: ''
  cache-baseline:
    description: >-
      Persist the report across runs via actions/cache and feed it back as the
      baseline ('true'/'false'). Uses an immutable per-run key + restore-keys
      prefix, so concurrent branches/matrix jobs never overwrite each other.
    required: false
    default: 'false'
  cache-key-prefix:
    description: Base of the baseline cache key (branch + run id are appended)
    required: false
    default: flakehound-report
  report-path:
    description: Where to write the report artifact
    required: false
    default: flakehound.report.json
  no-ai:
    description: Disable the AI interpretation layer ('true'/'false')
    required: false
    default: 'true'
  fail-on-new-regressions:
    description: Fail the step when new regressions are found ('true'/'false')
    required: false
    default: 'true'
  quarantine:
    description: Also run `flakehound quarantine` in dry-run and report pending actions ('true'/'false')
    required: false
    default: 'false'
  comment:
    description: Post/update the summary as a PR comment ('true'/'false'; needs pull_request event)
    required: false
    default: 'false'
  github-token:
    description: Token used for the PR comment
    required: false
    default: ${{ github.token }}

outputs:
  exit-code:
    description: flakehound exit code (0 clean · 1 new regression · 2 tool error)
    value: ${{ steps.analyze.outputs.exit-code }}
  report-path:
    description: Path of the written report artifact
    value: ${{ inputs.report-path }}
  quarantine-pending:
    description: Whether the quarantine dry-run found tests to quarantine or release ('true'/'false')
    value: ${{ steps.quarantine.outputs.quarantine-pending }}

runs:
  using: composite
  steps:
    - name: Build the flakehound CLI from the action checkout
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm ci --silent
        npm run build --silent

    # Restore the newest prior report. The primary key is unique per run, so it
    # never matches (its point is the *save* below); restore-keys prefix-matches
    # the newest cache on this branch, then the newest anywhere in scope. A miss
    # leaves no file → the Analyze step falls back to fail-safe (every regression
    # is new). Requires actions/cache to be available on the runner.
    - name: Restore baseline cache
      if: inputs.cache-baseline == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/flakehound-cache/flakehound.report.json
        key: ${{ inputs.cache-key-prefix }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ github.ref_name }}-
          ${{ inputs.cache-key-prefix }}-

    - name: Analyze
      id: analyze
      shell: bash
      run: |
        set +e
        args=(analyze --input "${{ inputs.input-glob }}" --json "${{ inputs.report-path }}")
        # Explicit baseline wins; otherwise fall back to the restored cache file
        # (present only on a cache hit). Either way, a missing file = no --baseline.
        baseline="${{ inputs.baseline }}"
        cache_file="${{ runner.temp }}/flakehound-cache/flakehound.report.json"
        if [ -z "$baseline" ] && [ "${{ inputs.cache-baseline }}" = "true" ] && [ -f "$cache_file" ]; then
          baseline="$cache_file"
        fi
        [ -n "$baseline" ] && args+=(--baseline "$baseline")
        [ "${{ inputs.no-ai }}" = "true" ] && args+=(--no-ai)
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
        rc=$?
        echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
        # 2 = the tool broke → always fail. 1 = a new regression → fail only
        # when the caller wants the gate to bite.
        if [ "$rc" -eq 2 ]; then exit 2; fi
        if [ "$rc" -eq 1 ] && [ "${{ inputs.fail-on-new-regressions }}" = "true" ]; then exit 1; fi
        exit 0

    # Stage the fresh report into the cache path, then save it under the unique
    # per-run key. Unique key ⇒ two concurrent runs never write the same entry
    # (no last-writer-wins on GitLab-style caches, no immutable no-op on GitHub),
    # and the next run's restore-keys picks it up as the newest. always() so a
    # gating regression (exit 1) still persists its report — that's what turns
    # the regression from "new" into "known" next run.
    - name: Save baseline cache
      if: always() && inputs.cache-baseline == 'true' && steps.analyze.outputs.exit-code != '2'
      shell: bash
      run: |
        mkdir -p "${{ runner.temp }}/flakehound-cache"
        cp "${{ inputs.report-path }}" "${{ runner.temp }}/flakehound-cache/flakehound.report.json"
    - name: Persist baseline cache
      if: always() && inputs.cache-baseline == 'true' && steps.analyze.outputs.exit-code != '2'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/flakehound-cache/flakehound.report.json
        key: ${{ inputs.cache-key-prefix }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Quarantine (dry-run)
      id: quarantine
      if: always() && inputs.quarantine == 'true' && steps.analyze.outputs.exit-code != '2'
      shell: bash
      run: |
        set +e
        # Dry-run never edits the caller's repo: it only reads the report, the
        # optional flakehound.config.* and flakehound.quarantine.json state.
        plan="$RUNNER_TEMP/flakehound-quarantine.txt"
        node "$GITHUB_ACTION_PATH/dist/cli.js" quarantine --report "${{ inputs.report-path }}" > "$plan" 2>&1
        rc=$?
        cat "$plan"
        if [ "$rc" -eq 2 ]; then exit 2; fi
        echo "quarantine-pending=$([ "$rc" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        # Markdown appendix shared by the job summary and the PR comment.
        {
          echo ''
          echo '### ⊘ Quarantine (dry-run)'
          echo ''
          echo '```'
          sed 's/\x1b\[[0-9;]*m//g' "$plan"
          echo '```'
        } > "$RUNNER_TEMP/flakehound-quarantine.md"

    - name: Job summary
      if: always() && steps.analyze.outputs.exit-code != '2'
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/scripts/report-to-markdown.mjs" "${{ inputs.report-path }}" >> "$GITHUB_STEP_SUMMARY"
        if [ -f "$RUNNER_TEMP/flakehound-quarantine.md" ]; then
          cat "$RUNNER_TEMP/flakehound-quarantine.md" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: PR comment
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request' && steps.analyze.outputs.exit-code != '2'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        body_file="$(mktemp)"
        node "$GITHUB_ACTION_PATH/scripts/report-to-markdown.mjs" "${{ inputs.report-path }}" > "$body_file"
        if [ -f "$RUNNER_TEMP/flakehound-quarantine.md" ]; then
          cat "$RUNNER_TEMP/flakehound-quarantine.md" >> "$body_file"
        fi
        # Upsert: one comment per PR, identified by the hidden marker.
        existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
          --jq '[.[] | select(.body | contains("<!-- flakehound-report -->"))][0].id' 2>/dev/null || true)
        if [ -n "$existing" ] && [ "$existing" != "null" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$body_file" >/dev/null
        else
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$body_file" >/dev/null
        fi
